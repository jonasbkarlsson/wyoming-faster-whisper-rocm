services:
  whisper:
    container_name: faster-whisper
    restart: unless-stopped
    build:
      context: .
    image: wyoming-faster-whisper-rocm
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8G
    volumes:
      - ./data:/data
    ports:
      - "10300:10300"
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/kfd:/dev/kfd"
#    environment:
#      - HSA_OVERRIDE_GFX_VERSION=9.0.0
